atlas:
  exception-handling:
    return-debug: true
quarkus:
  #  hibernate-orm:
  #    log:
  #      sql: false
  #      format-sql: true
  console:
    color: true
  #  cxf:
  #    client:
  #      uid:
  #        http-conduit-factory: URLConnectionHTTPConduitFactory
  #        client-endpoint-url: http://localhost:8050/uid-register/findByUid
  #  datasource:
  #    devservices:
  #      db-name: agridata
  #      enabled: true
  #      password: secret
  #      port: 5432
  #      username: admin
  #  flyway:
  #    locations:
  #      - classpath:db/migration
  cxf:
    client:
      adminService:
        client-endpoint-url: ${SOAP_ENDPOINT_URL:http://localhost:8901/backend/soap/AdminService/v1_44}
  http:
    cors:
      origins:
        - http://localhost:4200
  keycloak:
    # Embedded Keycloak on port 9999 (replaces the docker-compose setup from atlas-agate-local), shared
    # with atlas-agate-backend: the backend started second reuses the running container. It runs the
    # image delivered by atlas-agate-keycloak-customization, so its custom mappers shape the token as on
    # dev; image and realm-name must match application-test.yml and atlas-agate-backend. Bump the image
    # together with the realm export. realm-path is resolved on the classpath first, then on the file
    # system; the file lives under src/test/resources, so the path is relative to the module root.
    devservices:
      enabled: true
      image-name: 681832766879.dkr.ecr.eu-central-2.amazonaws.com/keycloak:1.0.0-rc.9
      realm-name: agate
      port: 9999
      realm-path: src/test/resources/agate-realm.json
      # The default 4S is too short for the realm import (measured ~4s on CI).
      web-client-timeout: 10S
  log:
    json:
      console:
        enabled: false
    category:
      ch.blw.agate.common.filters:
        level: info
      io.quarkiverse.wiremock.devservice.WireMockServer:
        level: WARN
      io.quarkus.oidc.client:
        level: WARN
      io.quarkus.rest.client:
        level: WARN
      org.jboss.resteasy.reactive.client.logging:
        level: WARN
      org.jboss.resteasy.reactive.server.logging:
        level: WARN
      ch.blw.agate.common.filters.RestClientLoggingFilter:
        level: info
    level: info

  # We use 2 oidc tenants to verify simultaneous access to the backend. This is prerequisite because when migrating from old to new agate there will be period where both tenants are active.
  oidc:
    resolve-tenants-with-issuer: true
    agate-local:
      auth-server-url: http://localhost:9999/realms/agate
      application-type: service
      authentication:
        user-info-required: true
      token:
        audience: agridata-backend
    agate-dev:
      auth-server-url: https://backend.blw-agate-dev.pc-core.isceco.admin.ch/idp/realms/agate
      application-type: service
      authentication:
        user-info-required: true
      token:
        audience: agridata-backend


  # The SOAP client fetches its token from the Keycloak Dev Service (client tvd-agate-api carries the
  # agate.Agate_Api_Identitas role required by the SOAP endpoint), so run atlas-agate-backend locally
  # alongside or point SOAP_ENDPOINT_URL elsewhere.
  oidc-client:
    auth-server-url: http://localhost:9999/realms/agate
    client-id: tvd-agate-api
    credentials:
      secret: secret
    grant:
      type: client
  #  rest-client:
  #    agis-register-api:
  #      url: http://localhost:8050/agis/register-data/1
  #    logging:
  #      body-limit: 10240
  #      scope: request-response
  smallrye-openapi:
    oidc-open-id-connect-url: http://localhost:9999/realms/agate/.well-known/openid-configuration
  swagger-ui:
    oauth-client-id: agate
  observability:
    # quarkus-opentelemetry pulls in the Grafana LGTM Dev Service in dev mode, which starts a container
    # and redirects the OTel exporter to it. Not needed while traces are only used for log correlation.
    enabled: false

